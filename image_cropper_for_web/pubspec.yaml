name: image_cropper_gdx_plus_for_web
resolution: workspace
description: Web implementation of the community-maintained image_cropper_gdx_plus plugin.
version: 1.0.0
homepage: https://gurwinderdevx.com
repository: https://github.com/47gurvinder/flutter_image_cropper
issue_tracker: https://github.com/47gurvinder/flutter_image_cropper/issues
funding:
  - https://buymeacoffee.com/gurwinderdevx

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.28.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  image_cropper_gdx_plus_platform_interface: ^1.0.0

  web: ">=0.5.0 <2.0.0"


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: image_cropper_gdx_plus
    platforms:
      web:
        pluginClass: ImageCropperPlugin
        fileName: image_cropper_gdx_plus_for_web.dart
