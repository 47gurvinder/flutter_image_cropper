name: Feature request
description: Suggest an improvement for image_cropper_gdx_plus
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve image_cropper_gdx_plus. Search existing issues before submitting a new request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation would this change address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior and API you would like.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - All supported platforms
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternative designs you considered.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a Pull Request for this feature.
