name: image_cropper_gdx_plus
resolution: workspace
description: A community-maintained Flutter plugin for cropping images on Android, iOS, and Web.
version: 1.0.0
homepage: https://gurwinderdevx.com
repository: https://github.com/47gurvinder/flutter_image_cropper
issue_tracker: https://github.com/47gurvinder/flutter_image_cropper/issues
funding:
  - https://buymeacoffee.com/gurwinderdevx

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.28.0'

flutter:
  plugin:
    platforms:
      android:
        package: vn.hunghd.flutter.plugins.imagecropper
        pluginClass: ImageCropperPlugin
      ios:
        pluginClass: FLTImageCropperPlugin
      web:
        default_package: image_cropper_gdx_plus_for_web

dependencies:
  flutter:
    sdk: flutter
  image_cropper_gdx_plus_platform_interface: ^1.0.0
  image_cropper_gdx_plus_for_web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  plugin_platform_interface: ^2.1.8
